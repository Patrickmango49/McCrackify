name: McCrackify browser smoke tests
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/scripts/web-smoke-test.mjs'
      - '.github/workflows/web-smoke-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test settings, player controls, responsive layout, and artwork fallback
        run: node .github/scripts/web-smoke-test.mjs
